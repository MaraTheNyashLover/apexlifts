name: iOS TestFlight

# Builds the Apex Lifts iOS app on a cloud Mac and uploads it to TestFlight.
# Runs on every push to main that touches the app, or by hand (Actions tab -> Run workflow).
#
# One required repository secret (Settings -> Secrets and variables -> Actions):
#   BUNDLE_KEY   passphrase that decrypts ci/secrets.tar.enc
# ci/secrets.tar.enc (AES-256, made with tools/pack-secrets.sh) contains:
#   AuthKey_XXXX.p8  App Store Connect API key
#   signing.p12      Apple Development + Apple Distribution certs and private key
#   env              ASC_KEY_ID, ASC_ISSUER_ID, SIGNING_P12_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (false = build only)"
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: ios-app/ios/App/App.xcodeproj
      SCHEME: App
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Select newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install Capacitor plugins and sync native project
        working-directory: ios-app
        run: |
          npm ci
          npx cap sync ios

      - name: Unpack signing secrets
        env:
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: |
          test -n "$BUNDLE_KEY" || { echo "::error::BUNDLE_KEY secret is not set"; exit 1; }
          S="$RUNNER_TEMP/secrets"; mkdir -p "$S"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BUNDLE_KEY -in ci/secrets.tar.enc | tar -x -C "$S"
          # env file holds ASC_KEY_ID, ASC_ISSUER_ID, SIGNING_P12_PASSWORD
          while IFS='=' read -r k v; do [ -n "$k" ] && { echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; }; done < "$S/env"
          mkdir -p "$HOME/private_keys"
          cp "$S"/AuthKey_*.p8 "$HOME/private_keys/"
          echo "ASC_KEY_PATH=$(ls "$HOME"/private_keys/AuthKey_*.p8)" >> "$GITHUB_ENV"

      - name: Import signing certificates into a temporary keychain
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          # Apple WWDR intermediates (needed for the cert chain to validate)
          for g in G3 G4 G5 G6; do
            curl -fsSL "https://www.apple.com/certificateauthority/AppleWWDRCA${g}.cer" -o "$RUNNER_TEMP/wwdr$g.cer" \
              && security import "$RUNNER_TEMP/wwdr$g.cer" -k "$KC" -T /usr/bin/codesign -T /usr/bin/security || true
          done
          security import "$RUNNER_TEMP/secrets/signing.p12" -k "$KC" -P "$SIGNING_P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"
          rm -rf "$RUNNER_TEMP/secrets"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|provision)|\*\* ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Export .ipa and upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios-app/ios/App/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"
          echo "Uploaded build $BUILD_NUMBER to TestFlight. It shows up in App Store Connect after Apple processes it (5-30 min)."

      - name: Export .ipa only (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios-app/ios/App/ExportOptions.local.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/secrets"
